    docket_no: "1:26-bk-10275"
    debtor_name: "Granite Senior Services, LLC"
    chapter: 11
    filed_date: 2026-03-30
    source_url: https://www.courtlistener.com/docket/73116750/granite-senior-services-llc/   # public docket (CourtListener id 73116750)
