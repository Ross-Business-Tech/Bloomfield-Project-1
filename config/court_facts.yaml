# excluded_sale_evidence: machine-found sale evidence that belongs to a different case.
# public_events: hand-checked PUBLIC distress events for one facility (by `case` hand-entry or `ccn`). Each needs a
#   public source_url. signal_type: foreclosure | lender_takeback | price_collapse | closure | receivership | ...
#   value (optional), flags (optional, copied onto the lead), lender / owner_after (context only: a lender is never
#   the buyer). Read by src/score/signals.py public_event_signals.
public_events:
  # Artemis Living at Littleton (Granite Senior Services, LLC, D.N.H. 26-10275). The campus at 1262 Saint Johnsbury
  # Road was still being built (Chamber profile: opening spring 2026).
  - case: "nhb:26-10275"
    signal_type: foreclosure
    event_date: 2026-09-24
    evidence_text: "Notice of Foreclosure Sale dated Sep 24, 2026: Service Federal Credit Union (d/b/a Service Credit Union), mortgagee, will sell 1262 Saint Johnsbury Road, Littleton NH (Lots 1 and 2) at public auction on Oct 29, 2026, under the mortgage given by Granite Senior Services, LLC (Jun 30, 2022)."
    source_url: https://paulmcinnis.com/media/ct1fviqr/notice-of-foreclosure-sale-lots-1-and-2.pdf
    lender: "Service Credit Union"
    flags: [borrower_name_mismatch]   # notice: Granite Senior Services, LLC; news: Granite Senior Operations LLC
  - case: "nhb:26-10275"
    signal_type: lender_takeback
    event_date: 2026-10-29
    evidence_text: "Service Credit Union, the foreclosing lender, bought the unfinished Littleton senior living campus for $13.5M at the Oct 29, 2026 auction (Moo92). The lender now owns it; it is not a buyer."
    source_url: https://moo92.com/credit-union-buys-littleton-senior-living-campus-for-13-5-million-in-auction/
    lender: "Service Credit Union"
    owner_after: "Service Credit Union (lender takeback)"
    flags: [borrower_name_mismatch]
  - case: "nhb:26-10275"
    signal_type: price_collapse
    event_date: 2026-10-29
    value: 0.47                       # $13.5M winning bid / $29M construction loan
    evidence_text: "Winning auction bid $13.5M against the $29M construction loan Service Credit Union made to Granite Senior Operations LLC (about 47% of the loan) (Moo92)."
    source_url: https://moo92.com/credit-union-buys-littleton-senior-living-campus-for-13-5-million-in-auction/
    flags: [borrower_name_mismatch]

