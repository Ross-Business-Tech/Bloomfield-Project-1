# Hand-checked court facts (Gate 3 top-5 check, Nov 10, 2026). Read by src/score/signals.py.
# Every entry needs a public source_url. Public court / CMS facts only; nothing confidential goes here.
#
# cases: public bankruptcy filings our court sources missed (loaded by `python -m src.discover.courts --source court_manual`).
#   court (CourtListener court id), docket_no, debtor_name, chapter, filed_date, source_url (a public docket listing)
