# Render Blueprint (PREP ONLY: nothing is deployed from this repo by Claude). See docs/DEPLOY_RENDER.md.
# Secrets are never in this file: `sync: false` values are typed into the Render dashboard, and the data snapshot is
# uploaded as a Secret File (it is never committed).
services:
  # Password-protected website showing a STATIC SNAPSHOT of the public lead list. No database or key at runtime.
  - type: web
    name: deal-radar
    runtime: python
    plan: free                      # spins down after 15 min idle; 750 free instance hours / month per workspace
    branch: development
    buildCommand: pip install -r requirements-web.txt
    startCommand: python -m src.web.server
    healthCheckPath: /healthz
    autoDeploy: false               # deploy by hand after review
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SITE_PASSWORD          # basic-auth password for every page (8+ characters)
        sync: false
      - key: SNAPSHOT_PATH          # Secret File path (Render mounts secret files under /etc/secrets/)
        value: /etc/secrets/site_snapshot.b64

