# Daily check of Deal Radar (src/pipeline/daily3.py): the FREE alternative to a Render cron job.
#
# Start: every day at 11:00 UTC (a live run), or by hand (Actions > daily3 > Run workflow; "dry-run" changes
# nothing, "live" may publish). Enabled Nov 12, 2026 after a cloud dry run passed. GitHub runs a schedule only from
# the copy of this file on the repository's DEFAULT branch; the job itself always checks out `development`, the
# branch the site is deployed from, so the code that builds the data is the code that shows it.
#
# AUTO-PUBLISH RULE (live): the run publishes only when every gate passes AND the lead count is within 10% of the
# last published list AND the top 20 has no material change. A material change is: a lead enters or leaves the top 20
# with a real change behind it (new lead, stage, buyer, court step), or a top-20 score moves by
# daily_check.top20_hold_score_move points or more (config/thresholds.yaml, an assumption). Rank swaps from daily
# date-based rescoring alone pass.
# HOLD: nothing is published, the job SUCCEEDS, and one issue "daily3 hold YYYY-MM-DD" is opened or updated with
# counts only (a person then reviews and publishes by hand). Any other failed gate or a crash FAILS the job, so
# GitHub emails the person who owns the schedule.
#
# PUBLIC-REPO LOG RULE: this repository and its Actions logs are public. The job prints counts and status only:
# the full output goes to a temp file that is never printed or uploaded, the summary lines are checked by
# src/pipeline/log_check.py (no building or buyer names, addresses, private terms or excluded ids) before they are
# shown, and NO data artifact is uploaded.
#
# Repository secrets (Settings > Secrets and variables > Actions; set from the laptop with
# `python -m src.pipeline.cloud_inputs --pack --set`; nothing private is in this file or in the repository):
#   SUPABASE_DB_URL, COURTLISTENER_TOKEN, ANTHROPIC_API_KEY (extraction, capped at $1 per run), RENDER_API_KEY
#   EXCLUDE_FACILITIES_GZ_B64   past-deal exclusion list
#   PRIVATE_TERMS_GZ_B64        private term list for the leak scan
#   CASE_LABELS_GZ_B64          hand labels of court cases
#   CHANGELOG_BASELINE_B64      the Nov 11 list the change log counts from
#   WATCHLIST_GZ_B64_1..12      watch list (public rows), split because a secret holds 48 KB; WATCHLIST_NAME
# PRE-FLIGHT: the run stops before any work when the exclusion list, the term list, the case labels or the Render
# key is missing or empty (src/pipeline/preflight.py; values are never printed).
#
# CourtListener: this account allows 125 requests per rolling 24 h and 50 per hour. daily3 caps ALL logged calls at
# 45 per rolling hour and 100 per rolling 24 h; courtlistener-daily.yml spends at most 15 and is counted too.
name: daily3

on:
  schedule:
    - cron: "0 11 * * *"     # 11:00 UTC = 6:00 am Eastern in winter (EST), 7:00 am in summer (EDT)
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run: read and check only, nothing is written or published. live: the real daily check."
        type: choice
        options: [dry-run, live]
        default: dry-run

permissions:
  contents: read
  issues: write            # the hold notice only (counts only)

concurrency:
  group: daily3
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Daily check (counts and status only)
        env:
          MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          EXCLUDE_FACILITIES_GZ_B64: ${{ secrets.EXCLUDE_FACILITIES_GZ_B64 }}
          PRIVATE_TERMS_GZ_B64: ${{ secrets.PRIVATE_TERMS_GZ_B64 }}
          CASE_LABELS_GZ_B64: ${{ secrets.CASE_LABELS_GZ_B64 }}
          CHANGELOG_BASELINE_B64: ${{ secrets.CHANGELOG_BASELINE_B64 }}
          WATCHLIST_NAME: ${{ secrets.WATCHLIST_NAME }}
          WATCHLIST_GZ_B64_1: ${{ secrets.WATCHLIST_GZ_B64_1 }}
          WATCHLIST_GZ_B64_2: ${{ secrets.WATCHLIST_GZ_B64_2 }}
          WATCHLIST_GZ_B64_3: ${{ secrets.WATCHLIST_GZ_B64_3 }}
          WATCHLIST_GZ_B64_4: ${{ secrets.WATCHLIST_GZ_B64_4 }}
          WATCHLIST_GZ_B64_5: ${{ secrets.WATCHLIST_GZ_B64_5 }}
          WATCHLIST_GZ_B64_6: ${{ secrets.WATCHLIST_GZ_B64_6 }}
          WATCHLIST_GZ_B64_7: ${{ secrets.WATCHLIST_GZ_B64_7 }}
          WATCHLIST_GZ_B64_8: ${{ secrets.WATCHLIST_GZ_B64_8 }}
          WATCHLIST_GZ_B64_9: ${{ secrets.WATCHLIST_GZ_B64_9 }}
          WATCHLIST_GZ_B64_10: ${{ secrets.WATCHLIST_GZ_B64_10 }}
          WATCHLIST_GZ_B64_11: ${{ secrets.WATCHLIST_GZ_B64_11 }}
          WATCHLIST_GZ_B64_12: ${{ secrets.WATCHLIST_GZ_B64_12 }}
        run: |
          for v in SUPABASE_DB_URL COURTLISTENER_TOKEN ANTHROPIC_API_KEY RENDER_API_KEY EXCLUDE_FACILITIES_GZ_B64 \
                   PRIVATE_TERMS_GZ_B64 CASE_LABELS_GZ_B64 CHANGELOG_BASELINE_B64 WATCHLIST_GZ_B64_1; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set."; exit 1; fi
          done
          umask 077
          PRIV="$RUNNER_TEMP/private"; LOG="$RUNNER_TEMP/daily3.log"; OUT="$RUNNER_TEMP/summary.txt"
          cleanup() { rm -rf "$PRIV" output "$LOG" "$RUNNER_TEMP/paths.env"; }
          trap cleanup EXIT
          # private inputs: secrets -> temp files (paths only are exported; values are never printed)
          python -m src.pipeline.cloud_inputs --restore "$PRIV" > "$RUNNER_TEMP/paths.env" 2>/dev/null \
            || { echo "::error::Could not restore the private inputs."; exit 1; }
          set -a; . "$RUNNER_TEMP/paths.env"; set +a
          # pre-flight: PASS / FAIL lines with counts only; stops here when an input is missing or empty
          python -m src.pipeline.preflight > "$OUT" 2>/dev/null || { cat "$OUT"; echo "::error::Pre-flight failed: nothing was run."; exit 1; }
          echo "mode: $MODE"
          if [ "$MODE" = "live" ]; then args="--live --publish --publish-changelog"; else args="--dry-run --strict --publish-changelog"; fi
          set +e
          python -m src.pipeline.daily3 $args > "$LOG" 2>&1
          rc=$?
          set -e
          grep -E '^(Pre-flight|   (PASS|FAIL|HOLD) |Hold:|Budget:|Publish:|Diff vs|Change log:)' "$LOG" > "$OUT" || true
          if [ "$rc" != "0" ]; then    # an error type only (never its message, which may quote data)
            echo "exit code $rc; last error type: $(grep -oE '^[A-Za-z_.]+(Error|Exception|Exit)' "$LOG" | tail -1)" >> "$OUT"
          fi
          # public-repo log rule: the summary is shown only when it holds no building / buyer name, address or private term
          snaps=""
          for f in output/site_snapshot.json output/daily3_dryrun/candidate_snapshot.json; do
            if [ -f "$f" ]; then snaps="$snaps --snapshot $f"; fi
          done
          if python -m src.pipeline.log_check "$OUT" $snaps > "$RUNNER_TEMP/logcheck.txt" 2>/dev/null; then
            cat "$OUT"; tail -1 "$RUNNER_TEMP/logcheck.txt"
          else
            tail -1 "$RUNNER_TEMP/logcheck.txt"; echo "::error::Log check failed: the summary was withheld."; exit 3
          fi
          # HOLD (exit 0): one issue per day, opened or updated, built ONLY from the checked count lines above
          if [ "$rc" = "0" ] && [ "$MODE" = "live" ] && grep -q '^Hold: YES' "$OUT"; then
            title="daily3 hold $(TZ=America/New_York date +%F)"
            body="$RUNNER_TEMP/hold.md"
            { echo "The daily check was HELD: nothing was published. A person reviews the top 20 and publishes by hand."
              echo; echo "Counts only (run $GITHUB_RUN_NUMBER):"; echo
              grep -E '^(   HOLD |Hold:|Diff vs)' "$OUT" | sed 's/^ */- /'; } > "$body"
            n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title \
                  -q "[.[] | select(.title == \"$title\")][0].number // empty")
            if [ -n "$n" ]; then gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --body-file "$body" > /dev/null
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body" > /dev/null; fi
            echo "::notice::Daily check HELD: nothing was published; see the issue \"$title\"."
          fi
          if [ "$rc" != "0" ]; then echo "::error::Daily check failed: nothing new was published."; fi
          exit $rc
